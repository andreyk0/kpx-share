[package]
name = "kpx-share"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Share one KeePassXC entry into an AI agent session as files on tmpfs"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23"
# MIT OR Apache-2.0, the de-facto standard Rust argument parser. `env` lets --db, --key-file and
# --yubikey fall back to KPX_SHARE_* variables.
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
# Only `Timestamp` is used (UTC instants, RFC 3339), so no time-zone database is pulled in.
jiff = { version = "1.0", default-features = false, features = ["std", "serde"] }
percent-encoding = "2.3"
quick-xml = "0.42"
rustix = { version = "1.1.6", features = ["event", "fs", "process", "rand"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
# `deny`, not `forbid`: the allocation-observing test needs a local `allow` to implement GlobalAlloc.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
